general {
    lock_cmd = pidof hyprlock || /home/kelos/.config/waybar-aero/lock-screen.sh
    before_sleep_cmd = /home/kelos/.config/waybar-aero/lock-screen.sh
    after_sleep_cmd = hyprctl dispatch dpms on
}

listener {
    timeout = 600
    on-timeout = /home/kelos/.config/waybar-aero/lock-screen.sh
}

listener {
    timeout = 900
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}